<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rounded square gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glossy top reflection -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Box / Closet subtle shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Subtle Gloss Overlay on top half -->
  <path d="M 32 144 C 32 82.13 82.13 32 144 32 L 368 32 C 429.87 32 480 82.13 480 144 C 480 200 380 260 256 260 C 132 260 32 200 32 144 Z" fill="url(#gloss)" />

  <!-- Inner Inventory & Dressing Graphic -->
  <g filter="url(#softGlow)">
    <!-- Hanger Hook (Dressing) -->
    <path d="M 256 128 C 238 128 224 142 224 160 C 224 174 233 186 246 190 L 256 194 L 256 210" 
          fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Hanger Triangle Body -->
    <path d="M 256 210 L 140 270 C 126 277 122 295 131 308 C 137 317 148 322 158 322 L 354 322 C 364 322 375 317 381 308 C 390 295 386 277 372 270 Z" 
          fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Inventory Box / Cube Outline Base (Stockage & Pièces) -->
    <path d="M 160 322 L 160 380 C 160 395 173 408 188 408 L 324 408 C 339 408 352 395 352 380 L 352 322" 
          fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Pocket Fold / Seam -->
    <path d="M 256 280 L 256 360" 
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.8" />

    <!-- Magic Inventory Sparkle (Top Right) -->
    <path d="M 370 120 Q 370 142 392 142 Q 370 142 370 164 Q 370 142 348 142 Q 370 142 370 120 Z" 
          fill="#fef08a" />
  </g>
</svg>
