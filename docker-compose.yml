version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pokedress_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pokedress
    volumes:
      - pokedress_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: pokedress_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  pokedress_data:
